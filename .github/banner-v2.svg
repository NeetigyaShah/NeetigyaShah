<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a101f"/>
      <stop offset="0.55" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#10203a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 H0 V34" fill="none" stroke="#7dd3fc" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1000" height="220" rx="0" fill="url(#bg)"/>
  <rect width="1000" height="220" fill="url(#grid)"/>
  <rect width="1000" height="220" fill="url(#glow)"/>

  <!-- abstract node graph, right side -->
  <g stroke="#7dd3fc" stroke-opacity="0.28" fill="none">
    <path d="M760 60 L830 110 L920 70 L960 130 L875 160 L830 110"/>
    <path d="M920 70 L955 45"/>
    <path d="M875 160 L940 185"/>
  </g>
  <g fill="#7dd3fc">
    <circle cx="760" cy="60" r="4.5"/>
    <circle cx="830" cy="110" r="6"/>
    <circle cx="920" cy="70" r="4.5"/>
    <circle cx="960" cy="130" r="4.5"/>
    <circle cx="875" cy="160" r="4.5"/>
  </g>
  <g fill="#38bdf8" opacity="0.55">
    <circle cx="955" cy="45" r="3"/>
    <circle cx="940" cy="185" r="3"/>
  </g>
  <circle cx="830" cy="110" r="11" fill="none" stroke="#38bdf8" stroke-opacity="0.5"/>

  <!-- terminal prompt -->
  <text x="48" y="58" font-family="Consolas, 'Cascadia Code', Menlo, monospace" font-size="15" fill="#7dd3fc">$ whoami</text>
  <text x="48" y="108" font-family="Consolas, 'Cascadia Code', Menlo, monospace" font-size="38" font-weight="bold" fill="#f1f5f9" letter-spacing="1">Neetigya Shah</text>
  <text x="48" y="142" font-family="Consolas, 'Cascadia Code', Menlo, monospace" font-size="16" fill="#94a3b8" textLength="430" lengthAdjust="spacingAndGlyphs">agentic systems &#183; verification layers &#183; shipped end to end</text>

  <!-- cursor block -->
  <rect x="482" y="126" width="10" height="18" fill="#38bdf8"><animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></rect>

  <!-- accent beam -->
  <rect x="48" y="166" width="300" height="2.5" rx="1.25" fill="url(#beam)"/>

  <text x="48" y="196" font-family="Consolas, 'Cascadia Code', Menlo, monospace" font-size="12.5" fill="#64748b">B.Tech CSE @ VIT &#183; GenAI Dev @ OceanAI (BSM) &#183; Bathinda, IN &#183; UTC +5:30</text>
</svg>
